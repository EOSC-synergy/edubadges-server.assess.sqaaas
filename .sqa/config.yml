config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/edubadges/edubadges-server:
      branch: develop
      repo: https://github.com/edubadges/edubadges-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.navy_graceful_sparrow.sh
        container: qc.acc_purple_mature_stork
  QC.Doc:
    repos:
      github.com/edubadges/edubadges-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.aqua_attentive_ostrich.sh
        container: qc.doc_pansy_timid_dugong
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.grege_savvy_ibis.sh
        container: qc.doc_amaranth_tactful_bat
      github.com/edubadges/edubadges-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.tangerine_independent_okapi.sh
        container: qc.doc_goldenrod_grumpy_narwhal
