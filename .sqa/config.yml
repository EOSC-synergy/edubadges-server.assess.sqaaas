config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/edubadges/edubadges-server:
      branch: develop
      repo: https://github.com/edubadges/edubadges-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.walnut_mysterious_warthog.sh
        container: qc.acc_ecru_grumpy_coyote
  QC.Doc:
    repos:
      github.com/edubadges/edubadges-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sepia_resilient_porcupine.sh
        container: qc.doc_mauve_apprehensive_raccoon
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.cobalt_bubbly_goose.sh
        container: qc.doc_denim_apathetic_warthog
      github.com/edubadges/edubadges-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.white_hopeful_snail.sh
        container: qc.doc_jasmine_ardent_jaguar
  QC.Lic:
    repos:
      github.com/edubadges/edubadges-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.onyx_vibrant_otter.sh
        container: qc.lic_clove_hardworking_raccoon
  QC.Sec:
    repos:
      github.com/edubadges/edubadges-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cream_sarcastic_chipmunk.sh
        container: qc.sec_persimmon_skeptical_chameleon
  QC.Sty:
    repos:
      github.com/edubadges/edubadges-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.flax_lively_kiwi.sh
        container: qc.sty_blush_energetic_antelope
      github.com/edubadges/edubadges-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.dawn_fierce_alpaca.sh
        container: qc.sty_ruby_grumpy_penguin
      github.com/edubadges/edubadges-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_sympathetic_hornbill.sh
        container: qc.sty_celadon_diligent_dormouse
  QC.Uni:
    repos:
      github.com/edubadges/edubadges-server pytest:
        commands:
        - /usr/bin/env sh .sqa/script.lavender_daring_flounder.sh
        container: qc.uni_thunder_apathetic_nighthawk
  QC.Ver:
    repos:
      github.com/edubadges/edubadges-server get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.olive_goofy_vulture.sh
        container: qc.ver_reef_philosophical_elephant
timeout: 5400
