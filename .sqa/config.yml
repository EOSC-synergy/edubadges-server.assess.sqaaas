config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/edubadges/edubadges-server:
      branch: develop
      repo: https://github.com/edubadges/edubadges-server
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.ecru_loving_porpoise.sh
        container: qc.acc_mulberry_mysterious_lobster
  QC.Doc:
    repos:
      github.com/edubadges/edubadges-server find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.khaki_flexible_eagle.sh
        container: qc.doc_currant_eager_axolotl
      github.com/edubadges/edubadges-server git:
        commands:
        - /usr/bin/env sh .sqa/script.butterscotch_fierce_wombat.sh
        container: qc.doc_gold_radiant_albatross
      github.com/edubadges/edubadges-server markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.cerise_adaptable_llama.sh
        container: qc.doc_cinnabar_blissful_raccoon
  QC.Lic:
    repos:
      github.com/edubadges/edubadges-server licensee:
        commands:
        - /usr/bin/env sh .sqa/script.jet_dramatic_kirin.sh
        container: qc.lic_beige_calm_serval
  QC.Sec:
    repos:
      github.com/edubadges/edubadges-server bandit:
        commands:
        - /usr/bin/env sh .sqa/script.fog_realistic_reindeer.sh
        container: qc.sec_jade_gentle_ferret
  QC.Sty:
    repos:
      github.com/edubadges/edubadges-server flake8:
        commands:
        - /usr/bin/env sh .sqa/script.amaranth_determined_piranha.sh
        container: qc.sty_cyan_stubborn_hydra
      github.com/edubadges/edubadges-server hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.pink_vigilant_hornbill.sh
        container: qc.sty_heather_sincere_koala
      github.com/edubadges/edubadges-server jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.ruby_aware_axolotl.sh
        container: qc.sty_sand_romantic_buffalo
  QC.Uni:
